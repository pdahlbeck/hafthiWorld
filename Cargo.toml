[package]
name = "hafthi_world"
version = "0.1.0"
edition = "2024"
description = "A Viking Age Gotland world-building prototype"
publish = false

[dependencies]
bevy = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }

# Keep native debug builds practical on desktop and cloud hosts.
[profile.dev]
debug = 0

[profile.dev.package.hafthi_world]
opt-level = 1
